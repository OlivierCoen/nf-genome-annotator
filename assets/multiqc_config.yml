report_comment: >
  This report has been generated by the <a href="https://github.com/OlivierCoen/genome_annotator/tree/dev" target="_blank">genome_annotator</a>
  analysis pipeline.
report_section_order:
  "genome_annotator-methods-description":
    order: -1000
  software_versions:
    order: -1001
  "genome_annotator-summary":
    order: -1002

export_plots: false

disable_version_detection: true

run_modules:
  - custom_content
  - busco
  - hisat2
  - star 
  - samtools
  - fastp
  - fastqc
  - seqkit

module_order:
  - busco:
      anchor: "busco_proteome"
      name: "BUSCO on final proteome"
      path_filters:
        - "*.reference.proteins.busco.txt"

  - busco:
      anchor: "busco_other_proteomes"
      name: "BUSCO on intermediate / alternative proteomes"
      generalstats: false
      path_filters:
        - "*.other.proteins.busco.txt"

  - busco:
      anchor: "busco_genome"
      name: "BUSCO on the genome"
      generalstats: false
      path_filters:
        - "*.genome.busco.txt" 
  
  - custom_content
  - hisat2:
      generalstats: false
  - star:
      generalstats: false
  - samtools:
      generalstats: false
  - fastp:
      generalstats: false
  - umitools/extract:
      generalstats: false
      
  - fastqc:
      name: "FastQC [ Raw short reads ]"
      generalstats: false
      info: "This section of the report shows FastQC results for short reads before filtering / trimming."
      path_filters:
        - "*.short_reads.raw.fastqc.zip"
  - fastqc:
      anchor: "fastqc_short_reads_cleaned"
      name: "FastQC [ Filtered / trimmed short reads ]"
      generalstats: false
      info: "This section of the report shows FastQC results for short reads after filtering / trimming."
      path_filters:
        - "*.short_reads.cleaned.fastqc.zip"
  - fastqc:
      anchor: "fastqc_long_reads_raw"
      name: "FastQC [ Raw long reads ]"
      generalstats: false
      info: "This section of the report shows FastQC results for long reads before filtering / trimming."
      path_filters:
        - "*.long_reads.raw.fastqc.zip"
  - fastqc:
      anchor: "fastqc_long_reads_cleaned"
      name: "FastQC [ Filtered / trimmed long reads ]"
      generalstats: false
      info: "This section of the report shows FastQC results for long reads after filtering / trimming."
      path_filters:
        - "*.long_reads.cleaned.fastqc.zip"
         
  - seqkit


custom_plot_config:
  busco:
    cpswitch: true
    cpswitch_c_active: true
   

section_comments:
  general_stats: "Main quality controls at a glance"
  busco: "BUSCO results of the final proteome and intermediate / alternative proteomes, compared to the genome"
  samtools: "Mapping statistics for short / long reads mapped to the genome"
    

remove_sections:
  - fastp-insert-size
  - fastp-seq-quality
  - fastp-seq-content-gc
  - fastp-seq-content-n 


sample_names_replace_regex: True
sample_names_replace:
  "(.*)\\.reference.proteins.busco": "\\1" 
  "(.*)\\.other.proteins.busco": "\\1" 
  "(.*)\\.genome.busco": "\\1" 


custom_data:

  with_isoforms_mrna_gff_stats:
    parent_id: gff_stats
    parent_name: "GFF statistics"
    parent_description: "Various statistics about GFF files."
    section_name: "With isoforms and mRNA"
    file_format: "csv"
    no_violin: true
    plot_type: "table"

  without_isoforms_mrna_gff_stats:
    parent_id: gff_stats
    parent_name: "GFF statistics"
    parent_description: "Various statistics about GFF files."
    section_name: "Without isoforms and mRNA"
    file_format: "csv"
    no_violin: true
    plot_type: "table"

  with_isoforms_rna_gff_stats:
    parent_id: gff_stats
    parent_name: "GFF statistics"
    parent_description: "Various statistics about GFF files."
    section_name: "With isoforms and RNA"
    file_format: "csv"
    no_violin: true
    plot_type: "table"

  without_isoforms_rna_gff_stats:
    parent_id: gff_stats
    parent_name: "GFF statistics"
    parent_description: "Various statistics about GFF files."
    section_name: "Without isoforms and RNA"
    file_format: "csv"
    no_violin: true
    plot_type: "table"

  with_isoforms_transcript_gff_stats:
    parent_id: gff_stats
    parent_name: "GFF statistics"
    parent_description: "Various statistics about GFF files."
    section_name: "With isoforms and transcript"
    file_format: "csv"
    no_violin: true
    plot_type: "table"

  without_isoforms_transcript_gff_stats:
    parent_id: gff_stats
    parent_name: "GFF statistics"
    parent_description: "Various statistics about GFF files."
    section_name: "Without isoforms and transcript"
    file_format: "csv"
    no_violin: true
    plot_type: "table"


sp:
  busco:
    fn: "*.busco.txt"
  samtools/idxstats:
    fn: '*.idxstats'
  samtools/flagstat:
    fn: '*.flagstat'
  samtools/stats:
    fn: '*.stats'
  hisat2:
    fn: '*.hisat2.summary.log'
  star:
    fn: '*Log.final.out'
  fastp:
    fn: '*.fastp.json'
  umitools/extract:
    fn: '*.umi_extract.log'
  fastqc/zip:
    fn: "*.fastqc.zip"
  seqkit/stats:
    fn: '*.seqkit_stats.tsv'
    
  with_isoforms_mrna_gff_stats:
    fn: "*_with_isoforms_mrna_gff_stats.csv"
  without_isoforms_mrna_gff_stats:
    fn: "*_without_isoforms_mrna_gff_stats.csv"
  with_isoforms_rna_gff_stats:
    fn: "*_with_isoforms_rna_gff_stats.csv"
  without_isoforms_rna_gff_stats:
    fn: "*_without_isoforms_rna_gff_stats.csv"
  with_isoforms_transcript_gff_stats:
    fn: "*_with_isoforms_transcript_gff_stats.csv"
  without_isoforms_transcript_gff_stats:
    fn: "*_without_isoforms_transcript_gff_stats.csv"
  func_stats_nb_holding:
    fn: "*.agat_func_stats.n_holding.csv"
  func_stats_nb_holded:
    fn: "*.agat_func_stats.n_holded.csv"
